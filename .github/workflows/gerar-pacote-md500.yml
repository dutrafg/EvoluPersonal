name: Gerar pacote offline MD500
on:
  workflow_dispatch:
  push:
    branches:
      - design/evolupersonal-rebrand-20261029
    paths:
      - .github/workflows/gerar-pacote-md500.yml
      - scripts/gerar_pacote_md500.py
permissions:
  contents: read
jobs:
  pacote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar arquivo ZIP oficial
        run: python3 scripts/gerar_pacote_md500.py
      - name: Publicar pacote como artefato do GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: md500-completo
          path: dist/downloads/md500-completo.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
