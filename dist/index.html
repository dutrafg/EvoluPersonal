catalog.push(...[{"id":"e375","name":"Elevação pélvica unilateral com peso do corpo ou halter","group":"Pernas","muscles":"Glúteo máximo","movement":"Elevação pélvica unilateral no chão: um pé apoiado, a outra perna elevada; estenda o quadril até alinhar tronco e coxa de apoio, mantendo a pelve nivelada, e desça com controle.","cue":"Deite-se com um pé apoiado e a outra perna elevada. Contraia o abdômen, eleve o quadril sem girar a pelve e retorne devagar. Se usar halter, mantenha-o estável sobre o quadril.","level":"Intermediário","priority":"exercício da lista de 500","list_id":252,"url":"","animation":"assets/exercises/e375.gif"},{"id":"e376","name":"Ponte de glúteo no solo com barra","group":"Pernas","muscles":"Glúteo máximo","movement":"Ponte de glúteos com barra no solo: barra acolchoada sobre o quadril, pés apoiados e joelhos flexionados; elevar quadril até alinhar tronco e coxas e baixar controlando.","cue":"Apoie as costas no chão, posicione a barra acolchoada sobre o quadril e mantenha os pés firmes. Eleve o quadril até alinhar tronco e coxas, sem hiperestender a lombar, e desça com controle.","level":"Intermediário","priority":"exercício da lista de 500","list_id":255,"url":"","animation":"assets/exercises/e376.gif"},{"id":"e377","name":"Elevação pélvica em base assimétrica (B-stance hip thrust)","group":"Pernas","muscles":"Glúteo máximo e posteriores da coxa","movement":"Hip thrust em base assimétrica: costas apoiadas no banco e barra acolchoada no quadril; pé principal sob o joelho e outro ligeiramente à frente para apoio leve; elevar e baixar o quadril sem inclinar a pelve.","cue":"Apoie as escápulas no banco. Deixe um pé sustentar a maior parte do peso e o outro um pouco à frente para equilíbrio; eleve o quadril mantendo a pelve nivelada e retorne controlando.","level":"Intermediário","priority":"exercício da lista de 500","list_id":253,"url":"","animation":"assets/exercises/e377.gif"},{"id":"e378","name":"Hiperextensão no banco 45° com foco em glúteo afastar o joelho de cima mantendo a pelve empilhada e retornar.","cue":"Coloque a mini band acima dos joelhos e deite-se de lado com os pés unidos. Abra o joelho de cima sem girar o tronco e feche lentamente.","level":"Iniciante","priority":"exercício da lista de 500","list_id":279,"url":"","animation":"assets/exercises/e381.gif"},{"id":"e382","name":"Coice na máquina (glute kickback machine)","group":"Pernas","muscles":"Glúteo máximo","movement":"Coice na máquina: tronco apoiado, pé na plataforma móvel; estender o quadril para trás contra a resistência sem arquear as costas e retornar controlando.","cue":"Ajuste o apoio para manter o tronco estável e posicione o pé na alavanca. Empurre a perna para trás contraindo o glúteo, sem arquear a lombar; retorne devagar.","level":"Intermediário","priority":"exercício da lista de 500","list_id":268,"url":"","animation":"assets/exercises/e382.gif"},{"id":"e383","name":"Extensão de quadril em quatro apoios com caneleira (donkey kick)","group":"Pernas","muscles":"Glúteo máximo","movement":"Extensão de quadril em quatro apoios com joelho flexionado a 90 graus: com caneleira, elevar a coxa mantendo o joelho dobrado e coluna neutra; retornar sem apoiar o peso de uma vez.","cue":"Apoie mãos e joelho no chão e mantenha o abdômen ativo. Com caneleira e joelho dobrado, eleve a coxa sem arquear a lombar; desça controlando.","level":"Intermediário","priority":"exercício da lista de 500","list_id":271,"url":"","animation":"assets/exercises/e383.gif"},{"id":"e384","name":"Elevação de panturrilha em pé no Smith (em cima do step)","group":"Pernas","muscles":"Gastrocnêmio e sóleo","movement":"Elevação de panturrilha no Smith em pé sobre step: antepés apoiados, calcanhares descem abaixo do nível do step e sobem em flexão plantar, joelhos estáveis.","cue":"Posicione a barra do Smith sobre os ombros e apoie os antepés no step. Desça os calcanhares com controle, eleve-se na ponta dos pés e evite quicar.","level":"Intermediário","priority":"exercício da lista de 500","list_id":445,"url":"","animation":"assets/exercises/e384.gif"},{"id":"e385","name":"Panturrilha unilateral no leg press","group":"Pernas","muscles":"Gastrocnêmio e sóleo","movement":"Panturrilha unilateral no leg press: antepé de um pé apoiado no trenó com joelho estável; empurrar pela ponta do pé e voltar flexionando o tornozelo.","cue":"Apoie o antepé de um lado no trenó e mantenha o joelho estável. Empurre o trenó pela ponta do pé, depois aproxime o calcanhar com controle; use carga confortável.","level":"Intermediário","priority":"exercício da lista de 500","list_id":455,"url":"","animation":"assets/exercises/e385.gif"},{"id":"e386","name":"Panturrilha no leg press vertical (90°)","group":"Pernas","muscles":"Sóleo e gastrocnêmio","movement":"Panturrilha no leg press vertical com joelhos flexionados: costas apoiadas e joelhos dobrados; antepés no apoio movem o trenó por flexão plantar, sem estender os joelhos.","cue":"Ajuste a máquina com as costas apoiadas e joelhos flexionados. Movimente o trenó pelo tornozelo, elevando e baixando os calcanhares sem mudar o ângulo dos joelhos.","level":"Intermediário","priority":"exercício da lista de 500","list_id":450,"url":"","animation":"assets/exercises/e386.gif"},{"id":"e387","name":"Elevação de panturrilha unilateral em pé com halter (no step/degrau)","group":"Pernas","muscles":"Gastrocnêmio e sóleo","movement":"Elevação unilateral de panturrilha em pé com halter sobre um degrau: antepé de um pé no step; baixar o calcanhar e elevar o corpo na ponta do pé com apoio para equilíbrio.","cue":"Segure um halter e apoie o antepé de um pé no degrau. Baixe o calcanhar sem perder o equilíbrio e eleve-se na ponta do pé; use a outra mão como apoio.","level":"Intermediário","priority":"exercício da lista de 500","list_id":447,"url":"","animation":"assets/exercises/e387.gif"},{"id":"e388","name":"Panturrilha no hack squat","group":"Pernas","muscles":"Gastrocnêmio e sóleo","movement":"Elevação de panturrilha no hack squat: ombros sob as almofadas e antepés na borda do apoio; elevar e baixar os calcanhares mantendo joelhos quase estendidos.","cue":"Ajuste os ombros sob as almofadas e deixe os antepés apoiados na borda da plataforma. Eleve os calcanhares e desça alongando a panturrilha, sem dobrar e estender os joelhos.","level":"Intermediário","priority":"exercício da lista de 500","list_id":448,"url":"","animation":"assets/exercises/e388.gif"},{"id":"e389","name":"Elevação tibial sentado na polia baixa ou máquina específica","group":"Pernas","muscles":"Tibial anterior","movement":"Elevação tibial sentado na polia baixa: cabo preso ao antepé, perna apoiada e tornozelo inicia em flexão plantar; puxar os dedos em direção à canela e retornar.","cue":"Sente-se com a perna apoiada e prenda o cabo ao antepé. Puxe os dedos em direção à canela sem mover o joelho e retorne lentamente.","level":"Iniciante","priority":"exercício da lista de 500","list_id":460,"url":"","animation":"assets/exercises/e389.gif"},{"id":"e390","name":"Panturrilha burro (donkey calf raise)","group":"Pernas","muscles":"Gastrocnêmio e sóleo","movement":"Panturrilha burro: tronco inclinado e quadris flexionados, antepés apoiados no degrau, carga sobre o quadril; abaixar e elevar os calcanhares sem balançar.","cue":"Incline o tronco mantendo a coluna confortável e apoie os antepés no degrau. Com a carga apoiada no quadril, abaixe e eleve os calcanhares de forma controlada.","level":"Intermediário","priority":"exercício da lista de 500","list_id":444,"url":"","animation":"assets/exercises/e390.gif"},{"id":"e391","name":"Adução de quadril em pé na polia baixa","group":"Pernas","muscles":"Adutores do quadril","movement":"Adução em pé na polia baixa: tornozeleira ligada à polia, perna ativa começa afastada e cruza em direção à linha média, sem inclinar o tronco; retornar lentamente.","cue":"Prenda a tornozeleira na polia baixa e fique de lado ao aparelho. Traga o pé em direção à linha média sem girar a pelve; pause e de quadril","group":"Core","muscles":"Oblíquos e glúteo médio","movement":"Prancha lateral com abdução: apoio no antebraço e pé inferior, corpo alinhado; afastar a perna de cima mantendo a pelve estável e retornar.","cue":"Apoie o antebraço e a lateral do pé, mantendo o corpo alinhado. Eleve a perna de cima sem girar a pelve e volte controlando; reduza a amplitude se perder estabilidade.","level":"Avançado","priority":"exercício da lista de 500","list_id":280,"url":"","animation":"assets/exercises/e395.gif"},{"id":"e396","name":"Adução isométrica com bola suíça entre os joelhos","group":"Pernas","muscles":"Adutores do quadril","movement":"Adução isométrica deitada com bola entre os joelhos: apertar a bola, manter a contração e relaxar gradualmente sem levantar a pelve.","cue":"Deite-se com os joelhos flexionados e a bola entre eles. Aperte a bola sem prender a respiração, mantenha brevemente e relaxe devagar.","level":"Iniciante","priority":"exercício da lista de 500","list_id":289,"url":"","animation":"assets/exercises/e396.gif"},{"id":"e397","name":"Roda abdominal (ab wheel rollout)","group":"Core","muscles":"Reto abdominal, transverso e ombros","movement":"Roda abdominal ajoelhado: segurar a roda, rolar para a frente mantendo tronco alinhado e retornar puxando pela musculatura do core, sem deixar a lombar ceder.","cue":"Ajoelhe-se no colchonete segurando a roda. Contraia o abdômen, role só até manter a lombar controlada e puxe para voltar; use amplitude menor se necessário.","level":"Avançado","priority":"exercício da lista de 500","list_id":464,"url":"","animation":"assets/exercises/e397.gif"},{"id":"e398","name":"Hiperextensão lombar no banco romano (45° ou 90°)","group":"Core","muscles":"Eretores da espinha, glúteos e posteriores da coxa","movement":"Hiperextensão no banco romano: quadris apoiados e tornozelos fixos, tronco desce pelo quadril e sobe até alinhar com as pernas, sem hiperestender a lombar.","cue":"Ajuste o apoio na altura do quadril e mantenha os tornozelos firmes. Incline o tronco pelo quadril e volte até alinhar o corpo, sem elevar além da linha das pernas.","level":"Intermediário","priority":"exercício da lista de 500","list_id":465,"url":"","animation":"assets/exercises/e398.gif"},{"id":"e399","name":"Elevação de pernas pendurado na barra fixa (toes to bar)","group":"Core","muscles":"Reto abdominal e flexores do quadril","movement":"Elevação de pernas pendurado até a barra: manter pegada firme e corpo controlado; elevar as pernas estendidas para tocar ou aproximar os pés da barra, descer sem balanço.","cue":"Pendure-se com pegada firme e estabilize o tronco. Eleve as pernas até os pés alcançarem a barra dentro da amplitude controlada e desça devagar, evitando balançar.","level":"Avançado","priority":"exercício da lista de 500","list_id":462,"url":"","animation":"assets/exercises/e399.gif"}]);

itoral maior, deltoide anterior e tríceps","movement":"Lying flat on a horizontal machine chest-press bench, feet firmly planted. Machine handles above mid-chest follow a fixed vertical pressing path; flex and extend elbows. No barbell, no free dumbbells.","cue":"Deite no banco horizontal do aparelho e apoie os pés. Empurre os pegadores acima do peito e retorne devagar, mantendo as costas apoiadas.","level":"Intermediário","priority":"variante exata da lista MD ainda sem GIF próprio","reference":"https://www.acefitness.org/resources/everyone/exercise-library/body-part/chest/","lot":17,"equipment":"Máquina de supino horizontal","url":"","motion":"e402","animation":"assets/exercises/e402.gif","animation_alt":"Demonstração em loop de Supino Reto na Máquina (Deitado / Horizontal)"},{"id":"e403","list_id":17,"name":"Supino com Pegada Neutra (Barra Suíça / Football Bar)","group":"Peito","muscles":"Peitoral maior, deltoide anterior e tríceps","movement":"Flat bench press holding a single Swiss football bar with clearly visible parallel internal neutral-grip handles, palms inward. Lower the bar to chest level with wrists aligned, then press upward.","cue":"Deite no banco reto e segure as alças paralelas da barra suíça, com palmas entre si. Desça a barra em direção ao peito e empurre sem dobrar os punhos.","level":"Intermediário","priority":"variante exata da lista MD ainda sem GIF próprio","reference":"https://www.acefitness.org/resources/everyone/exercise-library/body-part/chest/","lot":17,"equipment":"Banco reto e barra suíça","url":"","motion":"e403","animation":"assets/exercises/e403.gif","animation_alt":"Demonstração em loop de Supino com Pegada Neutra (Barra Suíça / Football Bar)"},{"id":"e404","list_id":19,"name":"Supino Inclinado com Halteres e Pegada Neutra","group":"Peito","muscles":"Peitoral maior, deltoide anterior e tríceps","movement":"Dumbbell incline press on 30-degree bench with neutral grip, palms facing each other throughout. Feet fixed, shoulders and head supported; dumbbells move from sides of upper chest to above shoulders.","cue":"No banco inclinado, mantenha as palmas das mãos voltadas uma para a outra. Desça os halteres ao lado do peito e empurre mantendo ombros e costas apoiados.","level":"Intermediário","priority":"variante exata da lista MD ainda sem GIF próprio","reference":"https://www.acefitness.org/resources/everyone/exercise-library/body-part/chest/","lot":17,"equipment":"Banco inclinado e halteres","url":"","motion":"e404","animation":"assets/exercises/e404.gif","animation_alt":"Demonstração em loop de Supino Inclinado com Halteres e Pegada Neutra"},{"id":"e405","list_id":20,"name":"Supino Reto com Rotação de Punho (Pronação no topo)","group":"Peito","muscles":"Peitoral maior, deltoide anterior e tríceps","movement":"Flat bench dumbbell press with wrist rotation: palms inward at bottom, slowly rotate to palms toward feet at top while extending elbows; reverse rotation on descent. Keep forearms vertical.","cue":"No banco reto, inicie com as palmas entre si. Empurre os halteres girando gradualmente os punhos para a pegada pronada no alto e desfaça a rotação na descida.","level":"Intermediário","priority":"variante exata da lista MD ainda sem GIF próprio","reference":"https://www.acefitness.org/resources/everyone/exercise-library/body-part/chest/","lot":17,"equipment":"Banco reto e halteres","url":"","motion":"e405","animation":"assets/exercises/e405.gif","animation_alt":"Demonstração em loop de Supino Reto com Rotação de Punho (Pronação no topo)"},{"id":"e406","list_id":21,"name":"Supino Inclinado a 30 Graus com Halteres","group":"Peito","muscles":"Peitoral maior, deltoide anterior e tríceps","movement":"Dumbbell incline press on visibly 30-degree incline bench. Pronated grip, feet planted, weights move from upper chest sides upward over shoulders. Bench angle fixed at 30 degrees.","cue":"Ajuste o banco em 30 graus. Com pés firmes e pegada pronada, desça os halteres ao lado da parte superior do peito e ção em loop de Crucifixo Unilateral na Polia Média"},{"id":"e411","list_id":54,"name":"Pullover no Banco com Barra W","group":"Peito","muscles":"Peitoral maior, latíssimo do dorso e serrátil anterior","movement":"Pullover lying supine along flat bench holding a short EZ curl bar in both hands above chest. Elbows slightly bent at fixed angle; arc bar backward above head within controlled shoulder range, then return over chest.","cue":"Deite no banco reto e segure a barra W acima do peito. Com cotovelos levemente flexionados, leve a barra em arco para trás da cabeça dentro da amplitude controlada e retorne.","level":"Intermediário","priority":"variante exata da lista MD ainda sem GIF próprio","reference":"https://www.acefitness.org/resources/everyone/exercise-library/body-part/chest/","lot":17,"equipment":"Banco reto e barra W","url":"","motion":"e411","animation":"assets/exercises/e411.gif","animation_alt":"Demonstração em loop de Pullover no Banco com Barra W"},{"id":"e412","list_id":60,"name":"Flexão Pliométrica (Com palma)","group":"Peito","muscles":"Peitoral maior, deltoide anterior e tríceps","movement":"Clap push-up on floor. Side three-quarter view: straight plank, lower chest with elbows flexing, press explosively until both hands leave floor briefly, clap once beneath chest, hands separate, land softly bending elbows, return stable plank. Feet stay in same place.","cue":"Alinhe o corpo em prancha, desça o peito e empurre de forma explosiva. Bata uma palma com as mãos fora do solo e aterrisse amortecendo com os cotovelos, sem perder o alinhamento.","level":"Avançado","priority":"variante exata da lista MD ainda sem GIF próprio","reference":"https://www.acefitness.org/resources/everyone/exercise-library/body-part/chest/","lot":17,"equipment":"Peso corporal","url":"","motion":"e412","animation":"assets/exercises/e412.gif","animation_alt":"Demonstração em loop de Flexão Pliométrica (Com palma)"},{"id":"e413","list_id":73,"name":"Puxada Alta com Barra Romana (Pegada Neutra Média)","group":"Costas","muscles":"Latíssimo do dorso, romboides, trapézio e bíceps","movement":"Seated lat pulldown using medium-width Roman multi-grip bar with clearly visible parallel neutral handles. Thighs secured under pad, pull handle to upper chest keeping torso upright, then extend arms under control.","cue":"Apoie as coxas sob as almofadas e segure as alças paralelas da barra romana. Puxe em direção à parte superior do peito mantendo o tronco firme e retorne devagar.","level":"Intermediário","priority":"variante exata da lista MD ainda sem GIF próprio","reference":"https://www.acefitness.org/resources/everyone/exercise-library/","lot":17,"equipment":"Polia alta e barra romana","url":"","motion":"e413","animation":"assets/exercises/e413.gif","animation_alt":"Demonstração em loop de Puxada Alta com Barra Romana (Pegada Neutra Média)"},{"id":"e414","list_id":74,"name":"Puxada Alta Articulada na Máquina (Convergente)","group":"Costas","muscles":"Latíssimo do dorso, romboides, trapézio e bíceps","movement":"Seated plate-loaded converging lat pulldown machine, two independent overhead lever arms. Thighs secured, pull neutral handles downward and inward beside upper chest, raise slowly. No cable bar.","cue":"Ajuste o apoio das coxas e segure os dois pegadores da máquina articulada. Puxe os braços do aparelho para baixo e para dentro sem balançar o tronco, depois retorne com controle.","level":"Intermediário","priority":"variante exata da lista MD ainda sem GIF próprio","reference":"https://www.acefitness.org/resources/everyone/exercise-library/","lot":17,"equipment":"Máquina articulada de puxada","url":"","motion":"e414","animation":"assets/exercises/e414.gif","animation_alt":"Demonstração em loop de Puxada Alta Articulada na Máquina (Convergente)"},{"id":"e415","list_id":79,"name":"Barra Fixa com Elástico de Assistência","group":"Costas","muscles":"Latíssimo do dorso, romboides, trapézio e bíceps","movement":"Band-assisted pronated pull-up. Elastic band looped over fixed high bar with one knee resting in lower loop. Both hands grip bar, flex elbows pulling chin to bar, lower with body aligned. Band remains visible and tensioned.","cue":"Prenda o elástico à barra fixa e apoie um joelho na alça. Segure a barra em pronação, eleve o corpo sem balanço e desça controlando a ajuda do elástico.","level":"Intermediário","priority":"variante exata da lista MD ainda sem GIF próprio","reference":"https://www.acefitness.org/resources/everyone/exercise-library/","lot":17,"equipment":"Barra fixa e elástico","url":"","motion":"e415","animation":"assets/exercises/e415.gif","animation_alt":"Demonstração em loop de Barra Fixa com Elástico de Assistência"},{"id":"e416","list_id":81,"name":"Barra Fixa no Triângulo (Sternum Chin-up)","group":"Costas","muscles":"Latíssimo do dorso, romboides, trapézio e bíceps","movement":"Sternum chin-up using a V triangle handle looped over fixed horizontal pull-up bar. Both hands on triangle close neutral grips; lean torso back while pulling lower chest toward handle; controlled return with feet off floor.","cue":"Prenda o triângulo à barra fixa e segure as alças com palmas entre si. Mantendo os pés suspensos, incline levemente o tronco para trás e aproxime o esterno do pegador; desça controlando.","level":"Avançado","priority":"variante exata da lista MD ainda sem GIF próprio","reference":"https://www.acefitness.org/resources/everyone/exercise-library/","lot":17,"equipment":"Barra fixa e triângulo","url":"","motion":"e416","animation":"assets/exercises/e416.gif","animation_alt":"Demonstração em loop de Barra Fixa no Triângulo (Sternum Chin-up)"},{"id":"e417","list_id":86,"name":"Remada Baixa Sentado na Polia com Barra Romana","group":"Costas","muscles":"Latíssimo do dorso, romboides, trapézio e bíceps","movement":"Seated low cable row with Roman bar, medium neutral grip, feet against fixed plates, knees slightly bent, neutral back. Pull handle toward abdomen by bending elbows then extend arms without swinging torso.","cue":"Apoie os pés na plataforma e segure a barra romana em pegada neutra. Puxe o pegador ao abdômen com coluna estável e retorne sem projetar o tronco.","level":"Intermediário","priority":"variante exata da lista MD ainda sem GIF próprio","reference":"https://www.acefitness.org/resources/everyone/exercise-library/","lot":17,"equipment":"Polia baixa e barra romana","url":"","motion":"e417","animation":"assets/exercises/e417.gif","animation_alt":"Demonstração em loop de Remada Baixa Sentado na Polia com Barra Romana"},{"id":"e418","list_id":87,"name":"Remada Baixa Sentado na Polia com Pegada Supinada","group":"Costas","muscles":"Latíssimo do dorso, romboides, trapézio e bíceps","movement":"Seated low cable row with straight bar and underhand supinated grip, palms upward, elbows near ribs. Feet fixed on plates and back neutral; pull bar toward abdomen and return.","cue":"Sentado na remada baixa, segure a barra reta com as palmas para cima. Puxe ao abdômen mantendo os cotovelos próximos das costelas e retorne sem balançar.","level":"Intermediário","priority":"variante exata da lista MD ainda sem GIF próprio","reference":"https://www.acefitness.org/resources/everyone/exercise-library/","lot":17,"equipment":"Polia baixa e barra reta","url":"","motion":"e418","animation":"assets/exercises/e418.gif","animation_alt":"Demonstração em loop de Remada Baixa Sentado na Polia com Pegada Supinada"},{"id":"e419","list_id":90,"name":"Remada Sentado na Máquina (Pegada Pronada Aberta - Foco Upper Back)","group":"Costas","muscles":"Latíssimo do dorso, romboides, trapézio e bíceps","movement":"Seated rowing machine with wide pronated horizontal handles and chest supported against fixed pad. Pull elbows outward to retract shoulder blades, then extend arms, keeping torso on support.","cue":"Apoie o peito no encosto da máquina e segure os pegadores em pronação aberta. Puxe com os cotovelos afastados e aproxime as escápulas, mantendo o peito apoiado.","level":"Intermediário","priority":"variante exata da lista MD ainda sem GIF próprio","reference":"https://www.acefitness.org/resources/everyone/exercise-library/","lot":17,"equipment":"Máquina de remada com apoio peitoral","url":"","motion":"e419","animation":"assets/exercises/e419.gif","animation_alt":"Demonstração em loop de Remada Sentado na Máquina (Pegada Pronada Aberta - Foco Upper Back)"},{"id":"e420","list_id":92,"name":"Remada Curvada no Smith","group":"Costas","muscles":"Latíssimo do dorso, romboides, trapézio e bíceps","movement":"Bent-over row on Smith machine. Bar constrained to vertical rails. Pronated grip, hip hinge, neutral back, knees slightly bent, pull bar toward abdomen then lower without moving torso. Rails and feet fixed.","cue":"Incline o tronco a partir do quadril, com joelhos levemente flexionados. Segure a barra do Smith em pronação e puxe ao abdômen sem mudar a posição das costas; desça na guia.","level":"Intermediário","priority":"variante exata da lista MD ainda sem GIF próprio","reference":"https://www.acefitness.org/resources/everyone/exercise-library/","lot":17,"equipment":"Smith","url":"","motion":"e420","animation":"assets/exercises/e420.gif","animation_alt":"Demonstração em loop de Remada Curvada no Smith"},{"id":"e421","list_id":95,"name":"Remada no Banco Inclinado com Barra","group":"Costas","muscles":"Latíssimo do dorso, romboides, trapézio e bíceps","movement":"Chest-supported incline bench barbell row. Face down on 30-degree elevated incline bench, feet planted. Hold straight bar with pronated grip below bench, pull bar toward lower chest with elbow flexion then lower. Bar never intersects bench.","cue":"Apoie o peito no banco inclinado com os pés firmes e espaço livre para a barra. Puxe a barra em direção à parte inferior do peito e estenda os braços sem tirar o tronco do apoio.","level":"Intermediário","priority":"variante exata da lista MD ainda sem GIF próprio","reference":"https://www.acefitness.org/resources/everyone/exercise-library/","lot":17,"equipment":"Banco inclinado e barra","url":"","motion":"e421","animation":"assets/exercises/e421.gif","animation_alt":"Demonstração em loop de Remada no Banco Inclinado com Barra"},{"id":"e422","list_id":98,"name":"Remada Unilateral no Landmine (Posição paralela)","group":"Costas","muscles":"Latíssimo do dorso, romboides, trapézio e bíceps","movement":"One-arm landmine row with body parallel to bar. Right hand grips free end of anchored bar, same-side arm rows toward hip, other hand supported on bench; feet stay planted and torso remains hinged and parallel to bar.","cue":"Fique ao lado e paralelo à barra presa no landmine. Apoie a mão livre no banco, puxe a extremidade carregada em direção ao quadril e retorne sem girar o tronco.","level":"Intermediário","priority":"variante exata da lista MD ainda sem GIF próprio","reference":"https://www.acefitness.org/resources/everyone/exercise-library/","lot":17,"equipment":"Landmine e banco de apoio","url":"","motion":"e422","animation":"assets/exercises/e422.gif","animation_alt":"Demonstração em loop de Remada Unilateral no Landmine (Posição paralela)"},{"id":"e423","list_id":100,"name":"Remada Serrote no Smith","group":"Costas","muscles":"Latíssimo do dorso, romboides, trapézio e bíceps","movement":"One-arm bent-over Smith row, both feet on floor, free hand on thigh, neutral spine. Pull bar vertically toward waist and lower without torso rotation. No bench.","cue":"Incline o tronco com os dois pés apoiados no chão. Apoie a mão livre na coxa e puxe a barra do Smith com uma mão em direção à cintura; desça na guia sem girar o tronco.","level":"Intermediário","priority":"variante exata da lista MD ainda sem GIF próprio","reference":"https://www.acefitness.org/resources/everyone/exercise-library/","lot":17,"equipment":"Smith","url":"","motion":"e423","animation":"assets/exercises/e423.gif","animation_alt":"Demonstração em loop de Remada Serrote no Smith"},{"id":"e424","list_id":105,"name":"Remada Gorila com Kettlebells (Gorilla Row)","group":"Costas","muscles":"Latíssimo do dorso, romboides, trapézio e bíceps","movement":"Gorilla row with two kettlebells on floor between spread feet. Hip hinge and neutral spine, flex knees slightly, pull right kettlebell toward hip while left hand supports on left kettlebell still on floor; lower right, then alternate left. No torso twisting.","cue":"Afaste os pés e incline o tronco com coluna estável. Apoie uma mão no kettlebell que permanece no chão e reme o outro em direção ao quadril; desça e alterne os lados sem girar o corpo.","level":"Intermediário","priority":"variante exata da lista MD ainda sem GIF próprio","reference":"https://www.acefitness.org/resources/everyone/exercise-library/","lot":17,"equipment":"Dois kettlebells","url":"","motion":"e424","animation":"assets/exercises/e424.gif","animation_alt":"Demonstração em loop de Remada Gorila com Kettlebells (Gorilla Row)"}]);

is, glúteos e eretores da coluna"],"208":["No Smith, mantenha a barra próxima das pernas e os joelhos levemente flexionados. Leve o quadril para trás e retorne estendendo-o, sem arredondar a coluna.","Isquiotibiais e glúteos"],"226":["Na cadeira flexora, posicione o joelho alinhado ao eixo do aparelho e flexione uma perna por vez, aproximando o calcanhar do glúteo. Retorne devagar.","Isquiotibiais"],"229":["Com tornozelos fixos e joelhos apoiados em superfície acolchoada, incline o corpo à frente como um bloco. Controle a descida com os posteriores e use assistência para retornar.","Isquiotibiais"],"249":["Apoie a parte superior das costas no banco e coloque a barra guiada sobre o quadril com proteção adequada. Eleve o quadril contraindo glúteos e desça.","Glúteo máximo e isquiotibiais"],"292":["Sentado com as costas apoiadas, inicie com halteres ao lado dos ombros. Empurre acima da cabeça mantendo os punhos estáveis e retorne com controle.","Deltoides e tríceps"],"298":["Em pé sob a barra guiada do Smith, inicie na altura dos ombros e empurre a barra para cima sem arquear a lombar. Desça à frente do rosto, dentro da amplitude confortável.","Deltoides e tríceps"],"303":["Sente no aparelho de desenvolvimento articulado com as costas apoiadas. Empurre as alças para cima e ligeiramente para dentro e retorne sem perder o alinhamento dos ombros.","Deltoides e tríceps"],"357":["Ajuste o banco em aproximadamente 45 graus e deixe os braços pendentes atrás do tronco. Flexione os cotovelos com halteres e desça sem balançar o tronco.","Bíceps braquial e braquial"],"373":["Com barra apropriada, execute sete repetições na metade inferior, sete na metade superior e sete completas, mantendo cotovelos estáveis.","Bíceps braquial e braquial"],"473":["Deitado no banco ou solo, mantenha o tronco firme e eleve as pernas até a amplitude que permita controlar a pelve. Desça devagar sem compensar na lombar.","Reto abdominal, flexores do quadril e estabilizadores do core"]};

function editRotation(action,value){
 if(!student(planStudent))return toast('Aluno inválido.');
 const before=structuredClone(db.rotationPlan||{}),r=structuredClone(rotationRecord(planStudent));
 const current=r.order[r.cursor];
 if(action==='add'){
  if(!own(planStudent).some(w=>w.id===value)||r.order.includes(value)||r.order.length>=20)return toast('Treino inválido ou limite atingido.');
  r.order.push(value);
 }else if(action==='up'||action==='down'){
  const j=value+(action==='up'?-1:1);
  if(!Number.isInteger(value)||value<0||j<0||j>=r.order.length)return;
  [r.order[value],r.order[j]]=[r.order[j],r.order[value]];
 }else if(action==='remove'){
  if(!Number.isInteger(value)||value<0||value>=r.order.length)return;
  r.order.splice(value,1);
 }else if(action==='advance'){
  if(!r.order.length)return;
  r.cursor=(r.cursor+1)%r.order.length;
 }else if(action==='reset'){r.cursor=0;}else return;
 if(['add','up','down','remove'].includes(action))r.cursor=r.order.length?(r.order.includes(current)?r.order.indexOf(current):Math.min(r.cursor,r.order.length-1)):0;
 db.rotationPlan=db.rotationPlan||{};db.rotationPlan[planStudent]=r;
 if(!validDB(db)||!save()){db.rotationPlan=before;return toast('Não foi possível salvar a rotação.')}
 render();toast('Rotação salva.');
}

function mdLibraryMatches(){

  if(group && e.group!==group)return false;
  if(!e.name.toLocaleLowerCase('pt-BR').includes(libSearch.toLocaleLowerCase('pt-BR')))return false;
  if(mdLibraryStatus==='animated'&&!e.animation)return false;
  if(mdLibraryStatus==='pending'&&e.animation)return false;
  if(mdLibraryStatus==='review'&&!e.media_review_pending)return false;
  if(mdLibraryStatus==='batch'&&!mdCurrentBatchIds.has(e.md_id))return false;
  return true;
 });
}
function mdLibraryRefresh(){
 const target=document.getElementById('libGrid');if(!target)return;
 target.innerHTML=libraryCards();
 const all=mdLibraryMatches(),pages=Math.max(1,Math.ceil(all.length/mdLibraryPageSize));
 const info=document.getElementById('mdLibraryInfo');
 if(info)info.textContent=all.length+' exercícios encontrados'+(all.length?' · mostrando '+(mdLibraryPage*mdLibraryPageSize+1)+'–'+Math.min(all.length,(mdLibraryPage+1)*mdLibraryPageSize):'');
 const pager=document.getElementById('mdLibraryPager');
 if(pager)pager.innerHTML='<button type="button" onclick="mdLibraryChangePage(-1)" '+(mdLibraryPage===0?'disabled':'')+'>Anterior</button><span>Página '+(mdLibraryPage+1)+' / '+pages+'</span><button type="button" onclick="mdLibraryChangePage(1)" '+(mdLibraryPage>=pages-1?'disabled':'')+'>Próxima</button>';
}
function mdLibraryChangePage(direction){
 mdLibraryPage=Math.max(0,Math.min(Math.ceil(mdLibraryMatches().length/mdLibraryPageSize)-1,mdLibraryPage+direction));
 mdLibraryRefresh();
}

function safeURL(s){try{let u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:null}catch(e){return null}}
function animationDisplayURL(e){const src=mdMediaSource(e);return src==='assets/exercises/e4.gif'?src+'?v=fix-single-frame-20261029':src}
function exerciseArt(e){const src=animationDisplayURL(e);return '<div class="libraryicon"'+(src?'':' aria-label="Animação ainda não disponível"')+'>'+(src?'<img src="'+esc(src)+'" alt="Animação do exercício '+esc(e.name)+'" loading="lazy" onerror="this.hidden=true;this.parentNode.setAttribute(\'aria-label\',\'Não foi possível carregar o GIF\')">':'<div class="no-motion">GIF ainda não cadastrado para este exercício</div>')+'</div>'}

function libraryCards(){
 const all=mdLibraryMatches(),pages=Math.max(1,Math.ceil(all.length/mdLibraryPageSize));
 mdLibraryPage=Math.max(0,Math.min(mdLibraryPage,pages-1));
 const pageList=all.slice(mdLibraryPage*mdLibraryPageSize,(mdLibraryPage+1)*mdLibraryPageSize);
 if(!pageList.length)return '<div class="md-no-results">Nenhum exercício encontrado com esses filtros.</div>';
 return pageList.map(e=>{
  const candidate=mediaCandidate(e);
  const has=!!candidate||!!mdMediaSource(e);
  const media=candidate?gymBellsSequence(candidate,e.name):has?'<img loading="lazy" src="'+esc(animationDisplayURL(e))+'" alt="'+(e.openexercisebase?'Ilustração de referência do exercício ':'GIF do exercício ')+esc(e.name)+'" onerror="this.hidden=true;this.parentElement.setAttribute(\'aria-label\',\'Não foi possível carregar a mídia\')">':
   '<div class="md-exercise-placeholder" role="img" aria-label="Mídia pendente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m9 9 6 3-6 3V9Z"/></svg><strong>Mídia pendente</strong></div>';
  return '<article class="md-exercise"><div class="md-exercise-head"><span class="md-exercise-id">'+String(e.md_id).padStart(3,'0')+'</span><span class="md-exercise-title" title="'+esc(e.name)+'">'+esc(e.name)+'</span></div>'+
  '<div class="md-exercise-group">'+esc(e.group)+'</div>'+
  '<div class="md-exercise-media">'+media+'</div>'+
  '<div class="md-exercise-bottom"><small>'+(candidate?candidate.dataset+' · '+(mediaCandidateApproved(e,candidate)?'aprovado':'candidato para revisão'):has?(e.openexercisebase?'OpenExerciseBase · CC BY-NC 4.0':e.media_review_pending?'GIF vinculado · em revisão':'Animação vinculada'):mdCurrentBatchIds.has(e.md_id)?'Lote 25 · em produção':'Sem mídia')+'</small><button type="button" class="md-exercise-button" onclick="showMotion(\''+esc(e.id)+'\')">'+(has?'Ver mídia':'Ver detalhes')+'</button></div></article>';
 }).join('');
}
function gymBellsSearchText(q){let s=String(q||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const swaps=[[/supino/g,'bench press'],[/agachamento/g,'squat'],[/remada/g,'row'],[/puxada/g,'pulldown'],[/rosca/g,'curl'],[/crucifixo/g,'fly'],[/flexao de bracos/g,'push up'],[/flexao/g,'push up'],[/paralelas|mergulho/g,'dip'],[/barra fixa/g,'pull up'],[/levantamento terra/g,'deadlift'],[/panturrilha/g,'calf'],[/prancha/g,'plank'],[/abdominal/g,'crunch'],[/halteres?|halter/g,'dumbbell'],[/barra/g,'barbell'],[/polia|cabo/g,'cable'],[/maquina/g,'machine'],[/declinado/g,'decline'],[/inclinado/g,'incline'],[/reto/g,'flat'],[/unilateral/g,'one arm'],[/alternado/g,'alternating'],[/neutra/g,'neutral'],[/sentado/g,'seated'],[/ajoelhado/g,'kneeling'],[/deitado/g,'lying'],[/smith/g,'smith']];for(const [re,v] of swaps)s=s.replace(re,v);return s.replace(/[()\/,.–-]/g,' ').split(/\s+/).filter(x=>x.length>2&&!['com','sem','para','por','das','dos','uma','de','da','do','na','no','em','foco','the','and','with','barbell','dumbbell'].includes(x))}
function searchExerciseSources(mdId,q){const box=document.getElementById('gymBellsSearchResults');if(!box)return;const tokens=gymBellsSearchText(q);const items=[...gymBellsCatalog.map(x=>({dataset:'GymBells',id:x.id,name:x.name,equipment:x.equipment||[],muscles:x.primary_muscles||[],start:'https://gellyfish-ai.github.io/gymbells-exercises/images/'+x.pose+'/start.png'})),...workoutGuideCatalog.map(x=>({dataset:'Workout Guide',id:x.id,name:x.name,equipment:x.equipment||[],muscles:x.primary_muscles||[],start:x.start}))];const ranked=items.map(x=>{const text=(x.name+' '+x.equipment.join(' ')+' '+x.muscles.join(' ')+' '+x.dataset).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const hits=tokens.filter(t=>text.includes(t)).length;return{x,score:hits/(tokens.length||1)+(tokens.length&&text.includes(tokens.join(' '))?0.5:0)}}).filter(x=>!tokens.length||x.score>0).sort((a,b)=>b.score-a.score||a.x.name.localeCompare(b.x.name)).slice(0,24);box.innerHTML=ranked.length?ranked.map(({x})=>'<article class="gymbells-search-result"><img src="'+esc(x.start)+'" alt="" loading="lazy" onerror="this.hidden=true"><div><strong>'+esc(x.name)+'</strong><small>'+esc(x.dataset)+' · '+esc(x.equipment.join(' · ')||'Peso corporal')+' · '+esc(x.muscles.join(', '))+'</small></div><button type="button" onclick="selectExerciseMedia('+mdId+',\\''+esc(x.dataset)+'\\',\\''+esc(x.id)+'\\')">Selecionar</button></article>').join(''):'<p class="muted">Nenhum resultado. Tente supino, agachamento, remada, ou o nome em inglês.</p>'}
function openGymBellsSearch(mdId){const e=exercise('md'+mdId);if(!e)return;openModal('Buscar em catálogos abertos','<p>Pesquise entre 631 exercícios GymBells e 302 ilustrações Workout Guide. Compare as poses antes de aprovar.</p><label>Buscar por nome, equipamento ou músculo<input id="gymBellsSearchInput" type="search" placeholder="Ex.: supino declinado com halteres" oninput="searchExerciseSources('+mdId+',this.value)"></label><div id="gymBellsSearchResults" class="gymbells-search-results"></div><p class="muted">GymBells: CC BY-NC 4.0. Workout Guide: CC BY-SA 4.0. Créditos e links de origem são exibidos na revisão.</p>');searchExerciseSources(mdId,'')}
function selectExerciseMedia(mdId,dataset,sourceId){const e=exercise('md'+mdId);if(!e)return toast('Exercício não encontrado.');if(dataset==='GymBells'){const x=gymBellsCatalog.find(r=>r.id===sourceId);if(!x)return toast('Exercício GymBells não encontrado.');e.gymbells={dataset:'GymBells',id:x.id,title:x.name,pose:x.pose,license:'CC BY-NC 4.0',credit:'Exercise illustrations by GymBells',sourceUrl:'https://github.com/gellyfish-ai/gymbells-exercises'};e.gymbells_review='candidate'}else if(dataset==='Workout Guide'){const x=workoutGuideCatalog.find(r=>r.id===sourceId);if(!x)return toast('Exercício Workout Guide não encontrado.');e.workoutguide={dataset:'Workout Guide',id:x.id,slug:x.slug,title:x.name,frames:x.frames,start:x.start,middle:x.middle,end:x.end,license:x.license,credit:x.credit,sourceUrl:x.sourceUrl};e.workoutguide_review='candidate'}else return; e.media_source_choice=dataset;save();closeModal();showMotion('md'+mdId)}
function reviewExerciseMedia(mdId,dataset,status){const e=exercise('md'+mdId);if(!e)return;if(dataset==='GymBells'&&e.gymbells)e.gymbells_review=status;else if(dataset==='Workout Guide'&&e.workoutguide)e.workoutguide_review=status;if(status==='approved')e.media_source_choice=dataset;save();closeModal();render();toast(status==='approved'?'Mídia aprovada para este exercício.':'Candidato rejeitado.');}
function showMotion(id){const e=exercise(id);if(!e)return toast('Exercício não encontrado.');const has=!!mdMediaSource(e);const oeb=!!e.openexercisebase;const g=mediaCandidate(e);const origin=g?g.dataset+' · '+g.license:oeb?'OpenExerciseBase · CC BY-NC 4.0':e.media_batch?'GIF 3D · '+e.media_batch:'GIF legado';const review=g?(mediaCandidateApproved(e,g)?'Correspondência aprovada pelo revisor.':'Candidato pendente: confira movimento, equipamento e variação antes de aprovar.'):oeb?'Imagem estática de referência importada; a associação deve ser conferida visualmente.':has?'Revisão biomecânica integral ainda pendente.':'Sem mídia produzida ou aprovada.';const credit=g?'<p><strong>Crédito:</strong> '+esc(g.credit)+' · '+esc(g.license)+' · <a href="'+esc(g.sourceUrl)+'" target="_blank" rel="noopener">fonte</a>. Mídia exibida por link.</p>':oeb?'<p><strong>Crédito:</strong> '+esc(e.openexercisebase.credit)+' · <a href="'+esc(e.openexercisebase.sourceUrl)+'" target="_blank" rel="noopener">fonte da imagem</a>. Associação ao nome em português realizada pelo EvoluPersonal.</p>':'';const compare=g?'<section class="gymbells-source-note"><strong>Candidato:</strong> '+esc(g.title)+'<div class="gymbells-sequence">'+gymBellsSequence(g,e.name).replace(/^<div[^>]*>|<\/div>$/g,'')+'</div><p>Confirme se o exercício, o equipamento e a variação correspondem.</p><div class="gymbells-review-actions"><button type="button" class="primary" onclick="reviewExerciseMedia('+e.md_id+',\''+esc(g.dataset)+'\',\'approved\')">Aprovar correspondência</button><button type="button" onclick="reviewExerciseMedia('+e.md_id+',\''+esc(g.dataset)+'\',\'rejected\')">Rejeitar candidato</button></div></section>':'';const searchButton=!g?'<div class=\'gymbells-review-actions\'><button type=\'button\' onclick=\'openGymBellsSearch('+e.md_id+')\'>Buscar no catálogo GymBells</button></div>':'';openModal(g?'Revisão de mídia '+esc(g.dataset):oeb?'Mídia de referência':'Animação do exercício','<h3>'+esc(e.name)+'</h3>'+exerciseArt(e).replace('libraryicon','libraryicon motionlarge')+'<section class="motionstatus" aria-label="Situação da mídia"><strong>Origem:</strong> '+(has||g?esc(origin):'Ainda sem mídia')+'<div><strong>Revisão:</strong> '+review+'</div></section>'+compare+searchButton+'<p><strong>Como executar:</strong> '+esc(e.cue)+'</p><p><strong>Músculos destacados:</strong> '+esc(e.muscles||'A confirmar')+'</p>'+credit)}

}

function settings(){return heading('DO SEU JEITO','Ajustes','Personalize o ambiente e cuide dos seus registros.')+'<div class="cols"><section class="card"><h2>Aparência</h2><p class="muted">Base grafite, azul de destaque e cartões arredondados, inspirados na identidade do EvoluFísico2.</p><button onclick="toggleTheme()">Alternar para tema '+(db.theme==='light'?'escuro':'claro')+'</button><h2 class="section">Sobre esta versão</h2><p class="muted">Alpha 0.11 · Rotação, substituições e evolução de treinos e cadastro de alunos, biblioteca de exercícios, prescrição de treinos e registro de sessões.</p><div class="notice">Próximas etapas: contas individuais, sincronização, avaliações, agenda e gestão de mensalidades. Esta versão não envia treinos ou dados para outros aparelhos.</div></section><section class="card"><h2>Seus dados</h2>'+(recoveryRaw?'<button onclick="exportRecovery()">Exportar cópia de recuperação</button>':'')+'<p class="muted">Faça backups regularmente. Os dados desta Alpha ficam apenas no navegador e podem ser perdidos se você limpar seus dados de navegação.</p><div class="row wrap"><button class="primary" onclick="exportData()">Exportar backup</button><button onclick="document.getElementById(\'importFile\').click()">Restaurar backup</button><input hidden type="file" accept=".json,application/json" id="importFile" onchange="importData(this)"></div><h3 class="section">Começar com seus alunos</h3><p class="muted">Remove alunos, treinos e sessões desta base. Mantém a biblioteca de exercícios e o tema.</p><button onclick="clearData()">Começar com base vazia</button></section></div>'}
function exportRecovery(){if(!recoveryRaw)return;const u=URL.createObjectURL(new Blob([recoveryRaw],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='EvoluPersonal_Recuperacao.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='EvoluPersonal_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exportado.')}
async function importData(input){let f=input.files[0];if(!f)return;try{if(f.size>10*1024*1024)throw Error();let data=JSON.parse(await f.text());if(!validDB(data))throw Error();data=migrateDB(data);if(!confirm('Restaurar este backup e substituir todos os registros atuais?'))return;db=data;selected=db.students[0]?.id||'';save();render();toast('Backup restaurado.')}catch(e){toast('Backup inválido ou incompatível. Os registros atuais foram preservados.')}finally{input.value=''}}
function clearData(){if(!confirm('Apagar os alunos, treinos e sessões deste navegador? Exporte um backup antes de continuar.'))return;db.students=[];db.workouts=[];db.sessions=[];db.drafts={};db.weekPlan={};db.rotationPlan={};db.demo=false;selected='';save();render();toast('Base pronta para seus alunos.')}
function toggleTheme(){db.theme=db.theme==='light'?'dark':'light';save();render()}
function openModal(t,html,wide=false){let m=document.getElementById('modal');m.classList.toggle('wide',wide);document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=html;m.showModal()}
function closeModal(){document.getElementById('modal').close()}
function bind(){let el=document.getElementById('studentSearch');if(el)el.oninput=e=>{search=e.currentTarget.value;document.getElementById('studentGrid').innerHTML=studentCards()};el=document.getElementById('workSearch');if(el)el.oninput=e=>{workSearch=e.currentTarget.value;document.getElementById('workResults').innerHTML=workoutCards(db.workouts.filter(w=>(w.title+' '+student(w.student)?.name).toLowerCase().includes(workSearch.toLowerCase())))};el=document.getElementById('libSearch');if(el)el.oninput=e=>{libSearch=e.currentTarget.value;mdLibraryPage=0;mdLibraryRefresh()};el=document.getElementById('groupFilter');if(el)el.onchange=e=>{group=e.currentTarget.value;mdLibraryPage=0;mdLibraryRefresh()};el=document.getElementById('mdLibraryStatus');if(el)el.onchange=e=>{mdLibraryStatus=e.currentTarget.value;mdLibraryPage=0;mdLibraryRefresh()};if(document.getElementById('mdLibraryInfo'))mdLibraryRefresh();el=document.getElementById('studentSelect');if(el)el.onchange=e=>{selected=e.currentTarget.value;render()}}
let timerHandle=null,timerEnd=0,remaining=0,paused=false;
function startTimer(seconds){if(seconds<=0)return toast('Este exercício está sem descanso prescrito.');stopTimer();remaining=seconds*1000;timerEnd=Date.now()+remaining;paused=false;document.getElementById('pauseBtn').textContent='Pausar';document.getElementById('timer').hidden=false;tick();timerHandle=setInterval(tick,250)}
function tick(){let ms=paused?remaining:Math.max(0,timerEnd-Date.now()),s=Math.ceil(ms/1000);document.getElementById('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(!paused&&ms<=0){stopTimer();toast('Descanso concluído. Pronto para a próxima série.')}}
function pauseTimer(){if(!paused){remaining=Math.max(0,timerEnd-Date.now());paused=true}else{timerEnd=Date.now()+remaining;paused=false}document.getElementById('pauseBtn').textContent=paused?'Continuar':'Pausar';tick()}
function stopTimer(){clearInterval(timerHandle);timerHandle=null;document.getElementById('timer').hidden=true}
document.getElementById('themeBtn').onclick=toggleTheme;document.getElementById('themeRail').onclick=toggleTheme;document.getElementById('modeBtn').onclick=()=>{mode=mode==='coach'?'student':'coach';render()};document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
render();if(loadError)toast('Não foi possível ler a base anterior. Verifique a recuperação em Ajustes.');else save();
