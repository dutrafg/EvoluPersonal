function validBaseDB(d){
 const id=x=>typeof x==='string'&&/^[A-Za-z0-9_-]{1,100}$/.test(x)&&!['__proto__','constructor','prototype'].includes(x),str=x=>typeof x==='string',num=(x,max)=>Number.isFinite(x)&&x>=0&&x<=max,records=xs=>Array.isArray(xs)&&xs.every(r=>r&&id(r.exercise)&&str(r.name)&&Number.isInteger(r.item)&&r.item>=0&&Number.isInteger(r.set)&&r.set>=1&&num(r.load,2000)&&str(r.reps)&&num(r.rest,3600)&&typeof r.done==='boolean'),unique=xs=>new Set(xs.map(x=>x.id)).size===xs.length;
 if(!d||d.version!==VERSION||!['light','dark'].includes(d.theme)||typeof d.demo!=='boolean')return false;
 if(!Array.isArray(d.students)||!d.students.every(s=>s&&id(s.id)&&str(s.name)&&s.name.trim()&&str(s.goal)&&str(s.email)&&str(s.notes))||!unique(d.students))return false;
 if(!Array.isArray(d.exercises)||!d.exercises.every(e=>e&&id(e.id)&&str(e.name)&&e.name.trim()&&str(e.group)&&str(e.url)&&(!e.url||safeURL(e.url)))||!unique(d.exercises))return false;
 if(!Array.isArray(d.workouts)||!d.workouts.every(w=>w&&id(w.id)&&str(w.title)&&w.title.trim()&&str(w.notes)&&d.students.some(s=>s.id===w.student)&&Array.isArray(w.items)&&w.items.length>0&&w.items.every(i=>i&&d.exercises.some(e=>e.id===i.exercise)&&Number.isInteger(i.sets)&&i.sets>0&&i.sets<=30&&str(i.reps)&&i.reps.trim()&&num(i.load,2000)&&Number.isInteger(i.rest)&&num(i.rest,3600)))||!unique(d.workouts))return false;
 if(!Array.isArray(d.sessions)||!d.sessions.every(s=>s&&id(s.id)&&d.students.some(x=>x.id===s.student)&&str(s.title)&&str(s.date)&&!Number.isNaN(Date.parse(s.date))&&str(s.effort)&&str(s.feedback)&&records(s.records)&&s.records.length>0&&s.records.every(r=>r.done))||!unique(d.sessions))return false;
 if(!d.drafts||typeof d.drafts!=='object'||Array.isArray(d.drafts))return false;
 return Object.entries(d.drafts).every(([key,x])=>{const w=d.workouts.find(w=>w.id===key);return w&&x&&records(x.records)&&x.records.length===w.items.reduce((a,i)=>a+i.sets,0)&&x.records.every(r=>w.items[r.item]?.exercise===r.exercise&&r.set<=w.items[r.item].sets)})
}

function workoutCards(list){return list.length?list.map(w=>'<div class="exrow"><div class="between"><div><h3>'+esc(w.title)+'</h3><p class="muted" style="margin:0;font-size:12px">'+esc(student(w.student)?.name)+' · '+w.items.length+' exercícios · '+counts(w.items).work+' séries de trabalho</p></div><div class="row wrap"><button onclick="workoutModal(\''+esc(w.id)+'\')">Editar</button><button onclick="duplicateWorkout(\''+esc(w.id)+'\')">Duplicar</button><button onclick="preview(\''+esc(w.student)+'\')">Ver como aluno</button><button class="quiet" onclick="deleteWorkout(\''+esc(w.id)+'\')" aria-label="Excluir '+esc(w.title)+'">Excluir</button></div></div></div>').join(''):'<div class="empty">Nenhum treino cadastrado.</div>'}
function duplicateWorkout(id){const w=structuredClone(db.workouts.find(w=>w.id===id));w.id=uid();w.title+=' · Cópia';db.workouts.push(w);save();render();toast('Cópia criada. Edite para atribuir a outro aluno.')}
function deleteWorkout(id){if(!confirm('Excluir este treino? As sessões concluídas serão preservadas.'))return;db.workouts=db.workouts.filter(w=>w.id!==id);delete db.drafts[id];save();render()}
function workoutModal(id,studentId){if(!db.students.length){toast('Cadastre um aluno antes de montar o treino.');studentModal();return}editor=id?structuredClone(db.workouts.find(w=>w.id===id)):{id:uid(),student:studentId||selected||db.students[0].id,title:'',notes:'',items:[]};openModal(id?'Editar treino':'Montar treino','<form id="workForm"><div class="fields"><label class="full">Nome do treino<input required maxlength="100" id="workTitle" value="'+esc(editor.title)+'" placeholder="Ex.: Treino A · Membros superiores"></label><label class="full">Aluno<select id="workStudent">'+db.students.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===editor.student?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></label><label class="full">Orientações<textarea id="workNotes" maxlength="1500">'+esc(editor.notes)+'</textarea></label></div><div class="between space"><h3>Exercícios</h3><span class="muted">Ordem de execução</span></div><div class="row"><select id="exercisePick" aria-label="Selecionar exercício">'+db.exercises.map(e=>'<option value="'+esc(e.id)+'">'+esc(e.name)+' · '+esc(e.group)+'</option>').join('')+'</select><button type="button" onclick="addItem()">Adicionar</button></div><div id="editorItems"></div><div class="modalfoot"><button type="button" onclick="closeModal()">Cancelar</button><button class="primary">Salvar treino</button></div></form>',true);renderItems();document.getElementById('workForm').onsubmit=e=>{e.preventDefault();if(!editor.items.length)return toast('Adicione pelo menos um exercício.');editor.title=document.getElementById('workTitle').value.trim();if(!editor.title)return toast('Informe o nome do treino.');editor.student=document.getElementById('workStudent').value;editor.notes=document.getElementById('workNotes').value;for(let n=0;n<editor.items.length;n++)ensurePlan(n);const candidate=structuredClone(db);candidate.drafts={};candidate.workouts=candidate.workouts.filter(w=>w.id!==editor.id);candidate.workouts.push(structuredClone(editor));if(!validDB(candidate))return toast('Revise séries de trabalho, referências, cargas e progressão antes de salvar.');let old=db.workouts.findIndex(w=>w.id===editor.id);if(old>=0){if(db.drafts[editor.id]&&!confirm('Salvar alterações e reiniciar o registro em andamento deste treino?'))return;db.workouts[old]=editor;delete db.drafts[editor.id]}else db.workouts.push(editor);save();closeModal();render();toast('Treino salvo e disponível na prévia do aluno.')}}
function moveItem(n,d){const j=n+d;if(j<0||j>=editor.items.length)return;[editor.items[n],editor.items[j]]=[editor.items[j],editor.items[n]];renderItems()}
function library(){const animated=db.exercises.filter(e=>/^assets\/exercises\/e\d+\.gif$/.test(e.animation||'')).length;const missing=Math.max(0,500-animated);return heading('SEU REPERTÓRIO','Biblioteca de exercícios',db.exercises.length+' exercícios cadastrados · '+animated+' com GIF · lote '+Math.ceil(animated/25)+' · faltam '+missing+' animações para 500.','<button class="primary" onclick="exerciseModal()">+ Exercício</button>')+'<div class="notice"><strong>'+animated+' / 500 exercícios animados</strong> · '+missing+' animações faltando · '+db.exercises.length+' exercícios cadastrados em português brasileiro.</div><div class="row wrap"><input class="search" id="libSearch" placeholder="Pesquisar exercício" aria-label="Pesquisar exercício" value="'+esc(libSearch)+'"><select id="groupFilter" style="max-width:200px" aria-label="Grupo muscular"><option value="">Todos os grupos</option>'+['Pernas','Peito','Costas','Ombros','Braços','Core','Cardio','Corpo todo','Outros'].map(g=>'<option '+(group===g?'selected':'')+'>'+g+'</option>').join('')+'</select></div><div class="grid" id="libGrid">'+libraryCards()+'</div>'}
function safeURL(s){try{let u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:null}catch(e){return null}}
function exerciseArt(e){const src=/^assets\/exercises\/e\d+\.gif$/.test(e.animation||'')?e.animation:'';return '<div class="libraryicon"'+(src?'':' aria-label="Animação ainda não disponível"')+'>'+(src?'<img src="'+esc(src)+'" alt="Demonstração animada de '+esc(e.name)+'; músculos destacados em laranja" loading="lazy">':'<div class="no-motion">GIF ainda não cadastrado para este exercício</div>')+'</div>'}
function libraryCards(){let list=db.exercises.filter(e=>(!group||e.group===group)&&e.name.toLowerCase().includes(libSearch.toLowerCase()));return list.length?list.map(e=>'<article class="card">'+exerciseArt(e)+'<div class="row wrap"><span class="pill">'+esc(e.group)+'</span><span class="tag">'+(e.animation?'GIF animado':'Sem animação')+'</span></div><h3 style="margin-top:13px">'+esc(e.name)+'</h3><p class="muted">'+esc(e.cue)+'</p><p class="muted" style="font-size:12px"><strong>Músculos destacados:</strong> '+esc(e.muscles||'A confirmar')+'</p><div class="between space"><button onclick="showMotion(\''+esc(e.id)+'\')">Ver animação</button><button onclick="exerciseModal(\''+esc(e.id)+'\')">Editar</button></div></article>').join(''):'<div class="empty">Nenhum exercício encontrado.</div>'}
function showMotion(id){let e=exercise(id);openModal(e.name,exerciseArt(e).replace('libraryicon','libraryicon motionlarge')+'<p><strong>Como executar:</strong> '+esc(e.cue)+'</p><p><strong>Músculos destacados:</strong> '+esc(e.muscles||'A confirmar')+'</p><p class="muted">Animação ilustrativa original. Ajuste a execução à orientação do profissional de Educação Física.</p>')}
function exerciseModal(id){let ex=exercise(id)||{name:'',group:'Pernas',url:''};openModal(id?'Editar exercício':'Novo exercício','<form id="exForm"><label>Nome<input name="name" required maxlength="100" value="'+esc(ex.name)+'"></label><label class="space">Grupo<select name="group">'+['Pernas','Peito','Costas','Ombros','Braços','Core','Cardio','Corpo todo','Outros'].map(g=>'<option '+(ex.group===g?'selected':'')+'>'+g+'</option>').join('')+'</select></label><label class="space">Link de demonstração (opcional)<input name="url" type="url" value="'+esc(ex.url)+'" placeholder="https://..."></label><p class="muted">Use um vídeo seu ou um link de demonstração autorizado.</p><div class="modalfoot"><button type="button" onclick="closeModal()">Cancelar</button><button class="primary">Salvar exercício</button></div></form>');document.getElementById('exForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.name=v.name.trim();if(!v.name)return toast('Informe o nome do exercício.');if(v.url&&!safeURL(v.url))return toast('Use um link HTTP ou HTTPS válido.');if(id)Object.assign(ex,v);else db.exercises.push({...v,id:uid()});save();closeModal();render();toast('Exercício salvo.')}}
function preview(id){selected=id;mode='student';render();window.scrollTo(0,0)}
function studentView(){return heading('ÁREA DO ALUNO','Seu próximo passo.','Confira o treino e registre sua execução.')+'<div class="notice"><strong>Prévia local da área do aluno.</strong> Este seletor serve para testar o fluxo. Login individual e sincronização entre aparelhos ainda não estão disponíveis.</div><label style="max-width:360px">Visualizar como<select id="studentSelect">'+db.students.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===selected?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></label>'+(student(selected)?'<div class="section"><h2>Olá, '+esc(student(selected).name.split(' ')[0])+'. Vamos treinar?</h2><p class="muted">Seu objetivo: '+esc(student(selected).goal)+'</p>'+ (own(selected).length?own(selected).map(sessionView).join(''):'<div class="card empty">Seu personal ainda não cadastrou um treino.</div>')+'<section class="card section"><h2>Suas sessões concluídas</h2>'+sessionList(db.sessions.filter(s=>s.student===selected).slice().reverse())+'</section></div>':'<div class="empty">Cadastre um aluno para testar.</div>')}
function finishModal(id){const w=db.workouts.find(w=>w.id===id),d=db.drafts[id];if(d.records.some(r=>!r.done))return toast('Marque todas as séries realizadas antes de concluir.');openModal('Como foi o treino?','<form id="finishForm"><label>Percepção de esforço<select name="effort"><option>Leve</option><option selected>Moderado</option><option>Intenso</option><option>Muito intenso</option></select></label><label class="space">Feedback para o personal<textarea name="feedback" maxlength="1500" placeholder="Como você se sentiu? Alguma dificuldade?"></textarea></label><div class="modalfoot"><button type="button" onclick="closeModal()">Voltar</button><button class="primary">Salvar sessão</button></div></form>');document.getElementById('finishForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));db.sessions.push({id:uid(),student:w.student,workout:w.id,title:w.title,date:new Date().toISOString(),records:structuredClone(d.records),suggestions:progressionSuggestions(w,d.records),...v});delete db.drafts[id];const suggestions=progressionSuggestions(w,d.records);save();stopTimer();closeModal();render();if(suggestions.length)openModal('Sugestões para o personal','<p>Revise antes de ajustar o treino.</p>'+suggestions.map(x=>'<p>'+esc(x)+'</p>').join(''));else toast('Sessão concluída! Seu histórico foi atualizado.')}}
function settings(){return heading('DO SEU JEITO','Ajustes','Personalize o ambiente e cuide dos seus registros.')+'<div class="cols"><section class="card"><h2>Aparência</h2><p class="muted">Base grafite, azul de destaque e cartões arredondados, inspirados na identidade do EvoluFísico2.</p><button onclick="toggleTheme()">Alternar para tema '+(db.theme==='light'?'escuro':'claro')+'</button><h2 class="section">Sobre esta versão</h2><p class="muted">Alpha 0.2 · Cadastro de alunos, biblioteca de exercícios, prescrição de treinos e registro de sessões.</p><div class="notice">Próximas etapas: contas individuais, sincronização, avaliações, agenda e gestão de mensalidades. Esta versão não envia treinos ou dados para outros aparelhos.</div></section><section class="card"><h2>Seus dados</h2>'+(recoveryRaw?'<button onclick="exportRecovery()">Exportar cópia de recuperação</button>':'')+'<p class="muted">Faça backups regularmente. Os dados desta Alpha ficam apenas no navegador e podem ser perdidos se você limpar seus dados de navegação.</p><div class="row wrap"><button class="primary" onclick="exportData()">Exportar backup</button><button onclick="document.getElementById(\'importFile\').click()">Restaurar backup</button><input hidden type="file" accept=".json,application/json" id="importFile" onchange="importData(this)"></div><h3 class="section">Começar com seus alunos</h3><p class="muted">Remove alunos, treinos e sessões desta base. Mantém a biblioteca de exercícios e o tema.</p><button onclick="clearData()">Começar com base vazia</button></section></div>'}
function exportRecovery(){if(!recoveryRaw)return;const u=URL.createObjectURL(new Blob([recoveryRaw],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='EvoluPersonal_Recuperacao.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='EvoluPersonal_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exportado.')}
async function importData(input){let f=input.files[0];if(!f)return;try{if(f.size>10*1024*1024)throw Error();let data=JSON.parse(await f.text());if(!validDB(data))throw Error();data=migrateDB(data);if(!confirm('Restaurar este backup e substituir todos os registros atuais?'))return;db=data;selected=db.students[0]?.id||'';save();render();toast('Backup restaurado.')}catch(e){toast('Backup inválido ou incompatível. Os registros atuais foram preservados.')}finally{input.value=''}}
function clearData(){if(!confirm('Apagar os alunos, treinos e sessões deste navegador? Exporte um backup antes de continuar.'))return;db.students=[];db.workouts=[];db.sessions=[];db.drafts={};db.demo=false;selected='';save();render();toast('Base pronta para seus alunos.')}
function toggleTheme(){db.theme=db.theme==='light'?'dark':'light';save();render()}
function openModal(t,html,wide=false){let m=document.getElementById('modal');m.classList.toggle('wide',wide);document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=html;m.showModal()}
function closeModal(){document.getElementById('modal').close()}
function bind(){let el=document.getElementById('studentSearch');if(el)el.oninput=e=>{search=e.currentTarget.value;document.getElementById('studentGrid').innerHTML=studentCards()};el=document.getElementById('workSearch');if(el)el.oninput=e=>{workSearch=e.currentTarget.value;document.getElementById('workResults').innerHTML=workoutCards(db.workouts.filter(w=>(w.title+' '+student(w.student)?.name).toLowerCase().includes(workSearch.toLowerCase())))};el=document.getElementById('libSearch');if(el)el.oninput=e=>{libSearch=e.currentTarget.value;document.getElementById('libGrid').innerHTML=libraryCards()};el=document.getElementById('groupFilter');if(el)el.onchange=e=>{group=e.currentTarget.value;document.getElementById('libGrid').innerHTML=libraryCards()};el=document.getElementById('studentSelect');if(el)el.onchange=e=>{selected=e.currentTarget.value;render()}}
let timerHandle=null,timerEnd=0,remaining=0,paused=false;
function startTimer(seconds){if(seconds<=0)return toast('Este exercício está sem descanso prescrito.');stopTimer();remaining=seconds*1000;timerEnd=Date.now()+remaining;paused=false;document.getElementById('pauseBtn').textContent='Pausar';document.getElementById('timer').hidden=false;tick();timerHandle=setInterval(tick,250)}
function tick(){let ms=paused?remaining:Math.max(0,timerEnd-Date.now()),s=Math.ceil(ms/1000);document.getElementById('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(!paused&&ms<=0){stopTimer();toast('Descanso concluído. Pronto para a próxima série.')}}
function pauseTimer(){if(!paused){remaining=Math.max(0,timerEnd-Date.now());paused=true}else{timerEnd=Date.now()+remaining;paused=false}document.getElementById('pauseBtn').textContent=paused?'Continuar':'Pausar';tick()}
function stopTimer(){clearInterval(timerHandle);timerHandle=null;document.getElementById('timer').hidden=true}
document.getElementById('themeBtn').onclick=toggleTheme;document.getElementById('themeRail').onclick=toggleTheme;document.getElementById('modeBtn').onclick=()=>{mode=mode==='coach'?'student':'coach';render()};document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
render();if(loadError)toast('Não foi possível ler a base anterior. Verifique a recuperação em Ajustes.');else save();
</script></body></html>
