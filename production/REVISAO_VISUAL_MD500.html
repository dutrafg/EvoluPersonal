const statusName={approved:'GIF aprovado',rejected:'Associação incorreta',uncertain:'Precisa de análise'};

function filtered(){const q=el('search').value.toLocaleLowerCase('pt-BR'),f=el('filter').value,g=el('group').value;return items.filter(x=>{const r=reviews[x.id]?.status||'pending';return (!q||(x.id+' '+x.name+' '+x.candidate+' '+x.candidateId).toLocaleLowerCase('pt-BR').includes(q))&&(f==='all'||f===r||f==='missing'&&!x.media)&&(g==='all'||g===x.group)})}

 const r=reviews[x.id]||{},status=r.status||'pending';
 const image=x.media?'<img src="'+esc(x.media)+'" alt="GIF do exercício '+esc(x.name)+'" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="empty" hidden>Não foi possível carregar: '+esc(x.media)+'</div>':'<div class="empty">GIF ainda não produzido</div>';

function move(n){pos+=n;render()}
function exportCSV(){const rows=[['MD_ID','Exercício','Grupo','GIF','Status mídia','Candidato OpenGym','ID OpenGym','Match textual','Revisão visual','Observação','Atualizado']];for(const x of items){const r=reviews[x.id]||{};rows.push([x.id,x.name,x.group,x.media,x.mediaState,x.candidate,x.candidateId,x.match,statusName[r.status]||'Sem revisão',r.note||'',r.updatedAt||''])}const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='revisao_visual_md500.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
